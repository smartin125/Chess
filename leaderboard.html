<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <style>
        :root {
            --bg-color: #5c8084;
            --card-bg: #a0b9bb;
            --primary: #212d30;
            --text: #212d30;
            --border: #dae3e7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1500px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            font-size: 35px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
        }

        input[type="text"] {
            flex: 2;
        }

        input[type="number"] {
            flex: 1;
        }

        button {
            background-color: var(--primary);
            color: #dae3e7;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.9;
        }

        .error-msg {
            color: #212d30;
            font-size: 13px;
            margin-top: -15px;
            margin-bottom: 15px;
            min-height: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: white;
            font-weight: 600;
        }

        .rank-col { width: 10%; text-align: center; }
        .name-col { width: 55%; }
        .score-col { width: 35%; text-align: right; }

        .team-details summary {
            cursor: pointer;
            font-weight: 600;
        }

        .team-roster {
            display: grid;
            gap: 6px;
            margin-top: 10px;
            text-align: left;
        }

        .team-member {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .team-member input {
            width: 76px;
            text-align: right;
        }

        td.score-col input {
            width: 70px;
            text-align: right;
            padding: 4px 8px;
            font-size: 14px;
            border: 1px solid transparent;
            background: transparent;
        }

        td.score-col input:focus {
            border-color: var(--primary);
            background: #dae3e7;
            outline: none;
            border-radius: 4px;
        }
        
        .actions-cell {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #212d30;
            cursor: pointer;
            font-size: 12px;
            padding: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="leaderboardTitle">Leaderboard</h1>
    
    <div class="form-group">
        <input type="text" id="playerName" placeholder="Player Name" autocomplete="off">
        <input type="number" id="playerScore" placeholder="Score (0)">
        <button onclick="addPlayer()">Add</button>
    </div>
    <div id="errorMsg" class="error-msg"></div>

    <table>
        <thead>
            <tr>
                <th class="rank-col">Rank</th>
                <th class="name-col" id="nameHeading">Name</th>
                <th class="score-col" style="text-align: right;">Score</th>
            </tr>
        </thead>
        <tbody id="leaderboardBody">
            <!-- Rows injected by JavaScript -->
        </tbody>
    </table>
</div>

<script>
    const isTeamLeaderboard = new URLSearchParams(window.location.search).get('mode') === 'team';
    const storageKey = isTeamLeaderboard ? 'teamLeaderboard' : 'leaderboard';
    const currentTournament = JSON.parse(localStorage.getItem('currentTournament') || 'null');
    let players = JSON.parse(localStorage.getItem(storageKey) || '[]');

    if (isTeamLeaderboard) {
        players = players.map(team => ({
            ...team,
            members: (team.members || []).map(member => typeof member === 'string'
                ? { name: member, score: 0 }
                : { ...member, score: Number(member.score) || 0 })
        }));
        document.getElementById('leaderboardTitle').textContent = currentTournament?.name
            ? `${currentTournament.name} Teams`
            : 'Team Leaderboard';
        document.getElementById('nameHeading').textContent = 'Team';
        document.getElementById('playerName').placeholder = 'Team Name';
        document.querySelector('.form-group button').textContent = 'Add Team';
    } else if (currentTournament?.name) {
        document.getElementById('leaderboardTitle').textContent = `${currentTournament.name} Leaderboard`;
    }

    // Initial render
    renderLeaderboard();

    function renderLeaderboard() {
        if (isTeamLeaderboard) {
            players.forEach(team => {
                team.score = team.members.reduce((total, member) => total + member.score, 0);
            });
        }
        // Sort players descending by score
        players.sort((a, b) => b.score - a.score);
        
        // Save to localStorage
        localStorage.setItem(storageKey, JSON.stringify(players));

        const tbody = document.getElementById('leaderboardBody');
        tbody.innerHTML = '';

        players.forEach((player, index) => {
            const row = document.createElement('tr');

            const rankCell = document.createElement('td');
            rankCell.className = 'rank-col';
            rankCell.textContent = index + 1;

            const nameCell = document.createElement('td');
            nameCell.className = 'name-col';
            if (isTeamLeaderboard) {
                const details = document.createElement('details');
                details.className = 'team-details';
                details.dataset.teamName = player.name;
                const summary = document.createElement('summary');
                summary.textContent = player.name;
                const roster = document.createElement('div');
                roster.className = 'team-roster';

                player.members.forEach(member => {
                    const memberRow = document.createElement('label');
                    memberRow.className = 'team-member';
                    const memberName = document.createElement('span');
                    memberName.textContent = member.name;
                    const memberScore = document.createElement('input');
                    memberScore.type = 'number';
                    memberScore.min = '0';
                    memberScore.step = '0.5';
                    memberScore.value = member.score;
                    memberScore.setAttribute('aria-label', `${member.name} score`);
                    memberScore.addEventListener('change', () => updateMemberScore(player.name, member.name, memberScore.value));
                    memberRow.append(memberName, memberScore);
                    roster.appendChild(memberRow);
                });

                details.append(summary, roster);
                nameCell.appendChild(details);
            } else {
                nameCell.textContent = player.name;
            }

            row.append(rankCell, nameCell);

            const scoreCell = document.createElement('td');
            scoreCell.className = 'score-col';
            const actions = document.createElement('div');
            actions.className = 'actions-cell';
            if (isTeamLeaderboard) {
                actions.textContent = player.score;
            } else {
                const scoreInput = document.createElement('input');
                scoreInput.type = 'number';
                scoreInput.value = player.score;
                scoreInput.addEventListener('change', () => updateScore(player.name, scoreInput.value));
                scoreInput.addEventListener('keydown', event => {
                    if (event.key === 'Enter') scoreInput.blur();
                });
                actions.appendChild(scoreInput);
            }
            const deleteButton = document.createElement('button');
            deleteButton.className = 'delete-btn';
            deleteButton.type = 'button';
            deleteButton.textContent = '✕';
            deleteButton.setAttribute('aria-label', `Delete ${player.name}`);
            deleteButton.addEventListener('click', () => deletePlayer(player.name));
                actions.appendChild(deleteButton);
            scoreCell.appendChild(actions);
            row.appendChild(scoreCell);
            tbody.appendChild(row);
        });
    }

    function addPlayer() {
        const nameInput = document.getElementById('playerName');
        const scoreInput = document.getElementById('playerScore');
        const errorMsg = document.getElementById('errorMsg');
        
        const name = nameInput.value.trim();
        // Default to 0 if left blank
        const score = scoreInput.value === '' ? 0 : parseInt(scoreInput.value, 10);

        errorMsg.textContent = '';

        if (!name) {
            errorMsg.textContent = 'Please enter a name.';
            return;
        }

        // Check for duplicate names (case-insensitive)
        const nameExists = players.some(p => p.name.toLowerCase() === name.toLowerCase());
        if (nameExists) {
            errorMsg.textContent = 'This player name already exists.';
            return;
        }

        // Add player and reset form
        players.push(isTeamLeaderboard ? { name, score, members: [] } : { name, score });
        nameInput.value = '';
        scoreInput.value = '';
        
        renderLeaderboard();
    }

    function updateMemberScore(teamName, memberName, newScore) {
        const team = players.find(player => player.name === teamName);
        const member = team?.members.find(player => player.name === memberName);
        if (!member) return;

        const score = newScore === '' ? 0 : Number(newScore);
        member.score = Number.isFinite(score) ? score : 0;
        renderLeaderboard();
        const updatedDetails = [...document.querySelectorAll('.team-details')]
            .find(details => details.dataset.teamName === teamName);
        if (updatedDetails) updatedDetails.open = true;
    }

    function updateScore(name, newScore) {
        const scoreValue = newScore === '' ? 0 : parseInt(newScore, 10);
        
        const player = players.find(p => p.name === name);
        if (player) {
            player.score = scoreValue;
            renderLeaderboard();
        }
    }

    function deletePlayer(name) {
        players = players.filter(p => p.name !== name);
        renderLeaderboard();
    }

</script>

</body>
</html>
