<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Spreadsheet</title>
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <body>
  <h1>Choose Template</h1>

</body>
    <style>

body {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  margin: 0;
  background-color: #5b7c82;
}

h1 {
  margin-bottom: 40px;
  text-align: center;
}
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 10px;
            background-color: #5c8084;
            gap: 100px ;
        }
        button {
            padding: 50px 100px;
            font-size: 16px;
            font-weight: bold;
            color: #212d30;
            background-color: #dae3e7;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
          
        }
        button:hover {
            background-color: #5c8084;
        }
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            margin: 0;
        }
        .back-link a {
            color: #212d30;
            font-weight: bold;
        }
    </style>
</head>
<body>
<p class="back-link"><a href="index.html">Back to home</a></p>

    <button id="download-btn">Download Individual Tournament Setup Template</button>

    <script>
        document.getElementById('download-btn').addEventListener('click', function() {
            try {
                const csvContent = "\uFEFF" + [
                    "Name",
                    "Sam",
                    "Owen"
                ].join("\n");

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                
                link.setAttribute("href", url);
                link.setAttribute("download", "IndividualTournamentTemplate.csv");
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
            } catch (error) {
                alert("An error occurred: " + error.message);
                console.error(error);
            }
        });
    </script>
    <button id="downloadteam-btn">Download Teams Tournament Setup Template</button>

    <script>
        document.getElementById('downloadteam-btn').addEventListener('click', function() {
            try {
                const csvContent = "\uFEFF" + [
                    "Team,Player 1,Player 2,Player 3,Player 4",
                    "Team A,Sam,Owen,Alex,Jordan",
                    "Team B,Casey,Taylor,Morgan,Riley"
                ].join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                
                link.setAttribute("href", url);
                link.setAttribute("download", "TeamsTournamentTemplate.csv");
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
            } catch (error) {
                alert("An error occurred: " + error.message);
                console.error(error);
            }
        });
    </script>

</body>
</html>
