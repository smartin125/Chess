<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Setup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        input[type="file"] {
            margin-bottom: 20px;
            padding: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 12px;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        #confirmbutton{
            display: none;
        }
        #tournamenttypeindividual{
            display: none;
        }
        #tournamenttypeteam{
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Select Tournament Type (1)</h2>
    <div>
    <input type="radio" id="optionind" name="choice" value="ind" checked>
    <label for="optionind">Individual</label>
  </div>

  <!-- The "That" Option -->
  <div>
    <input type="radio" id="optionteam" name="choice" value="team">
    <label for="optionteam">Teams</label>
  </div>
<span id="tournamenttypeindividual"><h2>Select Tournament Type (2)</h2>
    <div>
    <input type="radio" id="optionLadder" name="choice" value="Ladder" checked>
    <label for="optionLadder">Ladder</label>
  </div>
  <div>
    <input type="radio" id="optionRoundRobin" name="choice" value="RoundRobin">
    <label for="optionRoundRobin">Round Robin</label>
  </div>
  <div>
    <input type="radio" id="optionSwissSystem" name="choice" value="SwissSystem">
    <label for="optionSwissSystem">Swiss System</label>
  </div>
  <div>
    <input type="radio" id="optionKnockout" name="choice" value="Knockout">
    <label for="optionKnockout">Knockout</label>
  </div></span>

  <span id="tournamenttypeteam"><h2>Select Tournament Type (2)</h2>

  <div>
    <input type="radio" id="optionRoundRobin" name="choice" value="RoundRobin">
    <label for="optionRoundRobin">Round Robin</label>
  </div>
  <div>
    <input type="radio" id="optionSwissSystem" name="choice" value="SwissSystem">
    <label for="optionSwissSystem">Swiss System</label>
  </div>
  <div>
    <input type="radio" id="optionKnockout" name="choice" value="Knockout">
    <label for="optionKnockout">Knockout</label>
  </div></span>

  
  <h2>Enter Tournament Name</h2>
    <label for="username">Name (max 20 characters):</label>
<input type="text" id="username" name="username" maxlength="20">



    <h2>Import CSV Setup File</h2>
    <!-- File Input picker accepting only CSV files -->
    <input type="file" id="csvFileInput" accept=".csv" />
    <button id="confirmbutton">Confirm Details</button>
    <!-- Container where the parsed HTML table will look -->
    <div id="tableContainer"></div>
    
</div>

<script>
    const csvFileInput = document.getElementById('csvFileInput');
    const tableContainer = document.getElementById('tableContainer');
    const confirmbutton = document.getElementById('confirmbutton');
    const optionind = document.getElementById('optionind');
    const optionteam = document.getElementById('optionteam');
    const tournamenttypeindividual = document.getElementById('tournamenttypeindividual');
    const tournamenttypeteam = document.getElementById('tournamenttypeteam');

        optionind.addEventListener('change', function(e) {
        if (tournamenttypeindividual.style.display) {
            tournamenttypeindividual.style.display = 'inline-block';
        } else {
            tournamenttypeindividual.style.display = 'none'
        }
        
    });
        optionteam.addEventListener('change', function(e) {
        if (tournamenttypeteam.style.display='none') {
            tournamenttypeteam.style.display = 'inline-block';
        } else {
            tournamenttypeteam.style.display = 'none'
        }
        
    });

    csvFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        
        // Read file as plain text
        reader.onload = function(e) {
            const text = e.target.result;
            const data = parseCSV(text);
            generateTable(data);
        };

        reader.readAsText(file);
        
        confirmbutton.style.display = 'inline-block';
    });

    // Simple robust CSV parser handling basic row and column splitting
    function parseCSV(text) {
        const lines = text.split('\n');
        return lines
            .map(line => line.trim())
            .filter(line => line.length > 0) // Skip empty lines
            .map(line => line.split(','));   // Split columns by comma
    }

    // Constructs the HTML table elements dynamically
    function generateTable(data) {
        if (data.length === 0) return;

        let tableHtml = '<table>';

        // 1. Generate Table Header (First row of CSV)
        tableHtml += '<thead><tr>';
        data[0].forEach(headerText => {
            tableHtml += `<th>${escapeHtml(headerText)}</th>`;
        });
        tableHtml += '</tr></thead>';

        // 2. Generate Table Body (Remaining rows)
        tableHtml += '<tbody>';
        for (let i = 1; i < data.length; i++) {
            tableHtml += '<tr>';
            data[i].forEach(cellText => {
                tableHtml += `<td>${escapeHtml(cellText)}</td>`;
            });
            tableHtml += '</tr>';
        }
        tableHtml += '</tbody></table>';

        // Inject generated HTML block into the placeholder container
        tableContainer.innerHTML = tableHtml;
    }

    // Helper function to sanitize string and prevent HTML injection/XSS flaws
    function escapeHtml(string) {
        return String(string).replace(/[&<>"']/g, function(s) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[s];
        });
    }
</script>

</body>
</html>
