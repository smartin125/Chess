<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolphin Chess Manager</title>
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #5c8084;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
  
    body::before {
  content: "";
  position: fixed;
  width: 370px;
  height: 370px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: url("icon-192.png") center / contain no-repeat;
  clip-path: circle(50%);
  opacity: 0.15;
  pointer-events: none;
  z-index: -1;
}

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .site-title {
            margin: 0 0 clamp(30px, 3vw, 60px) 0;
            font-size: clamp(44px, 3.5vw, 76px);
            color: #212d30;
            font-weight: bold;
        }

        a:link {
            color: #dae3e7;
            text-decoration: none;
            font-size: clamp(28px, 2.4vw, 48px);
            font-weight: bold;
        }

        a:visited { color: #dae3e7; }
        a:hover   { color: #212d30; text-decoration: underline; }
        a:active  { color: #ffffff; }

        a {
            display: inline-block;
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1 class="site-title">Dolphin Chess Manager</h1>

        <div class="menu">
            <a href="downloadtemplates.html">Download Tournament Templates</a><br>
            <a href="tournamentsetup.html">Tournament Setup</a><br>
            <a href="leaderboard.html">Leaderboard</a><br>
            <a href="ladder.html">Ladder</a><br>
            <a href="pairing.html">Pairing</a>
        </div>
    </div>
<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
