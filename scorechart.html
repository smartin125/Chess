<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Round</title>
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #5c8084;
            color: #212d30;
            font-family: Arial, sans-serif;
        }
        main {
            max-width: 1500px;
            margin: 0 auto;
            padding: 24px;
            border-radius: 12px;
            background: #a0b9bb;
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #dae3e7;
        }
        th, td {
            min-width: 150px;
            padding: 10px;
            border: 1px solid #a0b9bb;
            text-align: left;
        }
        th:first-child, td:first-child {
            min-width: 85px;
        }
        select {
            display: block;
            width: 100%;
            margin-top: 6px;
            padding: 7px;
            border: 1px solid #a0b9bb;
            border-radius: 5px;
            background: white;
        }
        select[hidden] {
            display: none;
        }
        .opponent {
            font-size: 0.9em;
        }
        .message {
            min-height: 1.5em;
        }
        #teamSelector {
            margin-bottom: 16px;
            padding: 8px;
        }
        #playerSearch {
            margin: 0 8px 16px 0;
            padding: 8px;
        }
        .back-link {
            margin: 0 0 16px;
        }
        .back-link a {
            color: #212d30;
            font-weight: bold;
        }
    </style>
</head>
<body data-page="scores">
<main>
    <p class="back-link"><a href="leaderboard.html">Back to leaderboard</a></p>
    <h1 id="pageTitle">Score Round</h1>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <label id="teamSelectorLabel" for="teamSelector" hidden>Show team:</label>
    <select id="teamSelector" hidden></select>
    <div id="individualSelector" hidden>
        <label for="playerSearch">Search players:</label>
        <input id="playerSearch" type="search" autocomplete="off">
        <label for="playerSelector">Show player:</label>
        <select id="playerSelector"></select>
    </div>
    <div class="table-wrap">
        <table>
            <thead id="scoreHead"></thead>
            <tbody id="scoreBody"></tbody>
        </table>
    </div>
</main>
<script src="tournament.js"></script>
</body>
</html>
